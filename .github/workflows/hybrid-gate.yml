# WHY(kanon#2522): trailer-only gate-attestation hard-sticks off-slot PRs (no
# local `kanon gate --stamp` means no way to ever produce a passing required
# check). This is the hybrid mechanism aletheia#6426 proved: a Gate-Passed
# trailer takes a fast trailer-verify path; a trailer-less PR falls through to
# a real CI build of the same stages the trailer would have attested. A single
# `gate` job aggregates both paths into the one required check branch
# protection points at. All gate logic lives here — one fact, one place;
# callers only supply the commands and flags that vary per repo.
#
# WHY hosted in forkwright/.github, not forkwright/kanon: GitHub cannot
# resolve a `workflow_call` reusable workflow reference into a repo that is
# PRIVATE and owned by a personal (non-organization) account — every caller
# in a separate repo fails to even schedule the workflow (no run appears at
# all, not even a failed one). Proven empirically: all four initial adoption
# PRs (aletheia#6438, koinon#15, heurema#9, sphragis#13), each pointed at
# `forkwright/kanon/.github/workflows/hybrid-gate.yml@main`, failed atomically
# this way. The OLD trailer-only reusable already lived here and is called
# successfully by 8 repos — proof the public `.github` host resolves fine.
# This file is logically kanon-owned (kanon#2522 designs and maintains the
# mechanism); `.github` is the interim public home a private-repo caller
# structural limit requires. It moves back to kanon if/when kanon goes
# public.
name: Hybrid Gate (reusable)

on:
  workflow_call:
    # WHY expose this: under `strict: true` every merge invalidates every open
    # PR, so a markdown-only change re-runs a caller's full required job. This
    # workflow already computes exactly the fact that would avoid that, and a
    # caller reimplementing the path patterns locally would be a second copy of
    # logic that lives here -- free to diverge, and invisibly, since each side
    # would look correct in isolation. (thumos#775 measured ~324s of armv7a
    # cross-compile and QEMU witness matrix re-run twice for one one-line PR.)
    #
    # WARNING for callers: a caller must NOT gate a required check on this with
    # a job-level `if:` or a `needs:` on a preflight job -- either leaves the
    # required context never reporting, which strands the PR permanently. Gate
    # the expensive STEPS inside the job instead, so the check still reports.
    # A required check that can pass vacuously is worse than a slow one.
    #
    # WARNING on the empty case: this is empty rather than `false` when
    # check-trailer is skipped or cancelled. Treat anything other than the
    # literal `'true'` as not-docs-only -- the conservative direction, and the
    # same one this workflow's own `docs-only` step takes for an empty diff.
    outputs:
      docs_only:
        description: >-
          `'true'` when every changed path matched the docs-only patterns
          (`*.md`, `docs/*`, `llms.txt`) and the caller did not set
          `docs_only_exemption`. Empty when check-trailer did not run to a
          verdict. Callers should skip expensive steps only on the literal
          string `'true'`.
        value: ${{ jobs.docs-only.outputs.docs_only }}
    inputs:
      rust_toolchain:
        description: >-
          Rust toolchain channel to install (e.g. "1.89", "stable"). Leave
          empty (default) to auto-detect from the caller repo's own
          rust-toolchain.toml/rust-toolchain file via
          actions-rust-lang/setup-rust-toolchain — this is the fleet
          convention (see forkwright/harmonia CLAUDE.md: "Toolchain comes from
          rust-toolchain.toml, never workflow inputs"). Only set this input
          for a repo with no toolchain file of its own.
        type: string
        required: false
        default: ""
      system_packages:
        description: >-
          Space-separated apt package list to install via apt-get before
          check/clippy/nextest (e.g. "libasound2-dev pkg-config"). Empty
          (default) skips the install step entirely.
        type: string
        required: false
        default: ""
      fmt_cmd:
        description: The exact fmt-check command.
        type: string
        required: false
        default: "cargo fmt --all -- --check"
      check_cmd:
        description: The exact compile-check command.
        type: string
        required: false
        default: "cargo check --workspace --all-targets"
      clippy_cmd:
        description: The exact clippy command.
        type: string
        required: false
        default: "cargo clippy --workspace --all-targets -- -D warnings"
      nextest_cmd:
        description: The exact nextest invocation.
        type: string
        required: false
        default: "cargo nextest run --workspace"
      doctest_cmd:
        description: >-
          Optional separate doctest command (nextest does not execute
          doctests). Empty (default) skips this step. Set to e.g.
          "cargo test --workspace --doc" for a repo whose gate attests
          doctests too.
        type: string
        required: false
        default: ""
      needs_fleet_repo_token:
        description: >-
          Set true only when this repo's Cargo.toml resolves a git
          dependency that needs authenticated fetch (private fleet repo, or a
          public fleet repo where anonymous git-fetch rate limits have caused
          flakiness). Gates the git-credential step and the FLEET_REPO_TOKEN
          secret requirement; false skips both entirely so repos with no such
          dependency never need the secret wired.
        type: boolean
        required: false
        default: false
      rust_cache_key:
        description: Swatinem/rust-cache cache key discriminator.
        type: string
        required: false
        default: "gate-attestation"
      full_gate_timeout_minutes:
        description: Timeout for the full-gate-build job.
        type: number
        required: false
        # WHY 90 and not 45: on 2026-08-18 cold caches (post-billing-outage
        # expiry) canceled full-gate builds at 45m+ seconds on five repos in
        # one day (harmonia#718, stathmos#127, typikon#176, akroasis#392,
        # aletheia#6888) — each repo then bumped to 60-90 individually. The
        # default should cover the fleet's cold-cache p95; it is a ceiling for
        # runaway jobs, not a budget anyone is expected to consume. Repos with
        # tighter budgets keep their explicit override.
        default: 90
      ai_attribution_check:
        description: >-
          Run the fleet AI-attribution check (greps PR title/body and the
          PR-range commit messages for co-authored-by/generated-with/robot
          markers naming an AI tool). Default true. Bot/release-please PRs
          are waived the same as the trailer check. Set false only for a
          repo that has explicitly decided not to enforce this yet.
        type: boolean
        required: false
        default: true
      docs_only_exemption:
        description: >-
          Exempt a docs-only diff from full-gate-build even with no
          Gate-Passed trailer. A PR is docs-only when every changed path
          matches one of: **.md, docs/**, llms.txt (any nested `*.md` path,
          e.g. AGENTS.md or .github/CODEOWNERS.md, already matches the
          first pattern). Default true. Does not affect ai_attribution_check,
          which still runs on docs-only PRs.
        type: boolean
        required: false
        default: true
    secrets:
      FLEET_REPO_TOKEN:
        description: >-
          Token for git-credential access to private/rate-limited fleet
          deps. Required only when needs_fleet_repo_token is true.
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# WHY: concurrency lives on the reusable workflow (not the thin callers) so it
# is defined once; keyed by the CALLER's workflow + ref (both resolve to the
# caller's context in a reusable call) and repo-scoped, so each adopting repo
# cancels only its own superseded PR runs. Callers must NOT also set a
# concurrency group with this key, or the shared group self-cancels.
#
# WHY the SHA on a push: on a default branch the ref is CONSTANT, so a ref-keyed
# group made every merge cancel the previous commit's gate. Measured in aletheia
# over one window, two consecutive merges each lost their verdict entirely --
# 53ba8110b and 8dd94b02c, where the caller's own jobs went green and every job
# defined here was cancelled. The split fell exactly on the caller/callee
# boundary, because the caller had already SHA-keyed its pushes for this reason
# and this group had not. Worse than a missing verdict: `Evaluate gate result`
# fails on a cancelled upstream, so the commit reports RED with nothing wrong,
# which teaches people to discount red on a default branch.
#
# PRs keep ref-keying, so a force-push still supersedes its own in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # WHY hybrid-gate CONSUMES the docs-only reusable rather than keeping its own copy: this verdict
  # decides whether a full build runs, so a second implementation that drifts permissive reports
  # success having built nothing — and two copies drift silently, because any given repo exercises
  # only one of them. thumos#775 declined to re-implement it locally for exactly this reason.
  #
  # WHY pinned by SHA rather than `./` or `@main`: a relative `uses:` inside a reusable that is itself
  # called from another repository is ambiguous about which repo it resolves against, and this repo
  # had no nested-reusable precedent to settle it. A pinned absolute reference is unambiguous in both
  # positions and matches how callers already pin this file.
  docs-only:
    uses: forkwright/.github/.github/workflows/docs-only.yml@bf948dfbfefa9b59c2d5f6b10b5eb0df3f24fb52 # main
    with:
      docs_only_exemption: ${{ inputs.docs_only_exemption }}

  check-trailer:
    name: check-trailer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      found: ${{ steps.trailer.outputs.found }}
    steps:
      # WHY the blob filter: this job needs full history (`fetch-depth: 0`) to
      # read commit trailers and name changed paths, but it never reads file
      # CONTENT. On a large adopting repo the unfiltered clone is the entire
      # job, and when it exceeds `timeout-minutes: 5` the job reports
      # `cancelled` — which the gate cannot distinguish from a supersede, so it
      # fails a PR that nothing is wrong with. Measured in aletheia: two runs
      # cancelled at exactly 5m04s and 5m02s, both inside this checkout step,
      # on unrelated PRs. `blob:none` keeps every commit and tree while leaving
      # blobs unfetched; git lazily fetches any it turns out to need, so a
      # future step that does read content still works.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Check for Gate-Passed trailer
        id: trailer
        # WHY: automation PRs (dependabot, release-please) carry no
        # Gate-Passed trailer by nature — and that must route them to
        # full-gate-build like any other untrailered PR, never exempt the
        # build itself. A trailer waiver here once set found=true for bot
        # authors, which skipped full-gate-build entirely and let two
        # dependabot majors merge with red compiles (lockfile-only diffs
        # are the changesets MOST in need of a compile). A trailer NOT
        # found is a normal outcome routed to full-gate-build — this step
        # never exits 1.
        # WHY (#2399): bind to the PR TIP, not "any PR commit" — an un-stamped
        # tip must not ride an ancestor's trailer to skip full-gate-build.
        env:
          # WHY: head.sha reaches the script via env, not shell interpolation.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # WHY the fallback: github.event.pull_request.* is populated on
          # pull_request events ONLY. On a push, PR_HEAD_SHA is empty and
          # `git log -1 --format=%b ""` dies with exit 128, which crashes this
          # step before it writes `found` and fails the whole gate — the same
          # event-shape hazard the docs-only and ai-attribution steps above
          # already guard with their own fallback chains. On a push, HEAD IS
          # the tip, so #2399's tip-binding property is preserved either way.
          tip="${PR_HEAD_SHA:-HEAD}"
          body=$(git log -1 --format="%b" "$tip")
          if echo "$body" | grep -q "^Gate-Passed:"; then
            echo "Found gate attestation on tip ($tip): $(echo "$body" | grep '^Gate-Passed:' | head -1)"
            found=true
          else
            found=false
            echo "PR tip carries no Gate-Passed trailer (ancestors do not count — #2399); routing to full-gate-build."
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"

  full-gate-build:
    name: full-gate-build
    # WHY docs-only is in needs and not merely referenced: `needs.<job>` is undefined for a job this
    # one does not depend on, and the expression evaluates EMPTY rather than erroring. Here that
    # fails safe -- empty != 'true', so the full build always runs -- but it would have disabled the
    # docs-only exemption fleet-wide with nothing going red.
    needs: [check-trailer, docs-only]
    # WHY the event_name arm: a Gate-Passed trailer attests the tree it was
    # computed on, and the tree a commit has once it is on the default branch
    # is not that tree — landing rebases, squashes or merges it against
    # whatever else arrived first. Before the merge the trailer is the best
    # evidence available and skipping the build is the point; after it, the
    # attested tree no longer exists and honouring the trailer would report
    # the default branch as built without building it. A push therefore always
    # takes the build path, whatever the pushed tip carries.
    if: >-
      needs.docs-only.outputs.docs_only != 'true'
      && (github.event_name == 'push'
          || needs.check-trailer.outputs.found != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full_gate_timeout_minutes }}
    env:
      # WHY: full debuginfo is the bulk of the dev-profile target dir; with a
      # cold cargo cache the workspace test build can exceed the hosted
      # runner's free disk (ENOSPC killed aletheia's gate mid-nextest,
      # 2026-06-11). Line tables keep usable backtraces at a fraction of size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # WHY: hosted runners ship ~25 GB of toolchains this job never uses
      # (dotnet, Android, GHC, CodeQL bundles). The workspace test build needs
      # that headroom when the cargo cache is cold. Harmless on every repo
      # regardless of size, so this runs unconditionally rather than behind
      # an input.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          echo "free disk after reclaim:"
          df -h / | tail -1

      # WHY: empty toolchain input is deliberate — actions-rust-lang/setup-rust-toolchain
      # auto-detects from the caller repo's own rust-toolchain.toml when no
      # explicit `toolchain:` override is given, keeping the toolchain pin
      # single-sourced in the file each repo already carries (never
      # duplicated into this workflow's inputs unless a repo has no such
      # file).
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          components: rustfmt, clippy
          cache: false

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ${{ inputs.rust_cache_key }}

      - name: Install system dependencies
        if: inputs.system_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ${{ inputs.system_packages }}

      - name: Configure git credentials for fleet deps
        if: inputs.needs_fleet_repo_token
        env:
          FLEET_REPO_TOKEN: ${{ secrets.FLEET_REPO_TOKEN }}
        run: |
          if [ -z "${FLEET_REPO_TOKEN}" ]; then
            # WHY: dependabot-triggered runs read a separate secret store and receive no
            # Actions secrets, so this token is ALWAYS empty for them. Every forkwright git
            # dep is public, so anonymous fetch succeeds. Failing here made every bot PR
            # unmergeable by construction — measured in aletheia, where dependabot PR #6679
            # died at this step while #6681 two hours earlier passed it, because whether a
            # run sees the secret depends on how it was triggered rather than on need.
            # The token path stays for any future private dep; populate BOTH the Actions and
            # Dependabot secret stores at that point.
            #
            # WHY warn-and-continue rather than a needs_fleet_repo_token=false caller opt-out:
            # a caller cannot know at declaration time whether THIS run will be handed the
            # secret. The condition is the run's trigger, not the repo's dependency set.
            #
            # NOTE: aletheia carries the identical guard in its own
            # .github/actions/fleet-git-credentials composite. A reusable workflow cannot
            # reference a composite from its own repo (`./` resolves against the CALLER's
            # checkout), so this duplication is structural, not an oversight — keep the two
            # in sync by hand.
            echo "FLEET_REPO_TOKEN not set; skipping credential setup (public fleet deps fetch anonymously)."
            exit 0
          fi
          git config --global credential.helper store
          printf 'https://forkwright:%s@github.com\n' "${FLEET_REPO_TOKEN}" > ~/.git-credentials
          chmod 0600 ~/.git-credentials

      - name: Install cargo-nextest
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: nextest

      # WHY: these steps are the exact stages this repo's local gate attests
      # (fmt, check, clippy, nextest[, doctest]) — a Gate-Passed trailer and a
      # green full-gate-build must mean the same thing. The caller owns the
      # exact command strings; do not hardcode a repo's flags/features here.
      - name: fmt
        run: ${{ inputs.fmt_cmd }}

      - name: check
        run: ${{ inputs.check_cmd }}

      - name: clippy
        run: ${{ inputs.clippy_cmd }}

      - name: nextest
        run: ${{ inputs.nextest_cmd }}

      - name: doctest
        if: inputs.doctest_cmd != ''
        run: ${{ inputs.doctest_cmd }}

      - name: Upload nextest failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-gate-attestation
          path: |
            target/nextest/**/junit.xml
            target/nextest/**/*.log
          if-no-files-found: warn

  ai-attribution:
    name: ai-attribution
    if: inputs.ai_attribution_check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # WHY the blob filter: same reasoning as check-trailer above — this job
      # scans commit messages and PR metadata, never file content, so the
      # unfiltered full clone is pure cost against a 5-minute budget.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Verify no AI attribution
        # WHY: lifted verbatim from kanon's own gate-attestation.yml (and
        # harmonia's inline copy) — one implementation, centralized. Runs
        # regardless of docs_only_exemption — a docs-only PR still carries its
        # own title/body/commits and must not smuggle an attribution marker
        # through the build exemption.
        #
        # WARNING: the release-please waiver requires BOTH the branch shape and
        # a Bot author type, and neither alone is sufficient. `github.head_ref`
        # is the branch name chosen by whoever opens the PR, so a branch-shaped
        # waiver is a predicate the checked party controls — anyone could name a
        # branch `release-please--branches--x` and exempt any content. The
        # branch pattern still has to be part of it, because release-please's
        # LOGIN varies (github-actions[bot] under GITHUB_TOKEN today, a PAT
        # owner after kanon#1092) while its branch shape does not. `user.type`
        # supplies the half the branch cannot: GitHub derives it from the
        # resolved account and a pusher cannot set it.
        #
        # NOTE: when kanon#1092 moves release-please to a PAT-owned (human)
        # account, `user.type` becomes "User" and this waiver stops firing — the
        # release PR goes red rather than silently exempt, which is the correct
        # direction to fail. Add that login to an explicit allowlist then.
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          case "$PR_HEAD_REF" in
            release-please--branches--*)
              if [ "$PR_AUTHOR_TYPE" = "Bot" ]; then
                echo "Release-please branch from bot author ($PR_AUTHOR): AI attribution check exempt."
                exit 0
              fi
              echo "Branch $PR_HEAD_REF has the release-please shape but author $PR_AUTHOR is type ${PR_AUTHOR_TYPE:-unknown}, not Bot — not waiving."
              ;;
          esac
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Trusted bot PR author: $PR_AUTHOR"
            echo "AI attribution check auto-passed for trusted bot PR."
            exit 0
          fi

          # WHY line-anchored: PR bodies may legitimately discuss the policy in
          # prose (e.g. quoting "Co-authored-by: Claude …"). Only trailer-shaped
          # lines and explicit generated-with/robot markers are enforcement targets.
          #
          # WHY these specific alternates, each from an observed marker rather
          # than from guessing at vendor names:
          #   moonshot / openai   -- vendor names a co-authored-by trailer uses
          #                          that the claude/gpt/codex/kimi/gemini/
          #                          anthropic set does not cover.
          #   🧠                   -- a second robot-class glyph seen alongside 🤖.
          #   claude-session:      -- a trailer key emitted next to, not inside,
          #                          the co-authored-by line, so the trailer
          #                          alternate above never sees it.
          #   https://claude.(ai|com)/
          #                       -- the session and product URLs, which appear
          #                          on their OWN line beneath the generated-with
          #                          line. That line carries no 🤖 and no
          #                          "generated with", so stripping the marker
          #                          line above it left this one standing.
          pattern='^(co-authored-by:.*(claude|gpt|codex|kimi|moonshot|gemini|anthropic|openai)|claude-session:|🤖|🧠|generated with|https://claude\.(ai|com)/)'
          violation=0

          title_hits=$(printf '%s\n' "$PR_TITLE" | grep -inE "$pattern" || true)
          if [ -n "$title_hits" ]; then
            echo "ERROR: AI attribution marker found in PR title."
            printf '%s\n' "$title_hits" | sed 's/^/  title: /'
            violation=1
          fi

          # Guard null/empty PR body so the step does not crash; grep on an empty
          # string simply returns no matches, but the explicit || true makes the
          # intent obvious and protects against unexpected GitHub env quirks.
          body_hits=$(printf '%s\n' "$PR_BODY" | grep -inE "$pattern" || true)
          if [ -n "$body_hits" ]; then
            echo "ERROR: AI attribution marker found in PR body."
            printf '%s\n' "$body_hits" | sed 's/^/  body: /'
            violation=1
          fi

          # WHY: same event-shape hazard as the docs-only step — github.base_ref is
          # pull_request-only, so on a push this interpolated to `origin/..HEAD` and aborted
          # the step. Scanning must still happen on a push: that is exactly when an
          # attribution marker would land on the default branch unreviewed.
          if [ -n "$BASE_REF" ]; then
            commit_range="origin/${BASE_REF}..HEAD"
          elif [ -n "$EVENT_BEFORE" ] \
            && git rev-parse --verify --quiet "${EVENT_BEFORE}^{commit}" >/dev/null 2>&1; then
            commit_range="${EVENT_BEFORE}..HEAD"
          elif git rev-parse --verify --quiet 'HEAD~1^{commit}' >/dev/null 2>&1; then
            commit_range="HEAD~1..HEAD"
          else
            commit_range="HEAD"
          fi

          commit_hits=$(git log --format="%s%n%b" "$commit_range" | grep -inE "$pattern" || true)
          if [ -n "$commit_hits" ]; then
            echo "ERROR: AI attribution marker found in PR-range commits."
            printf '%s\n' "$commit_hits" | sed 's/^/  commit: /'
            violation=1
          fi

          if [ "$violation" -ne 0 ]; then
            echo "Remove AI attribution markers (Co-authored-by AI, 🤖, 'generated with') from the PR title, body, and commits."
            exit 1
          fi

  gate:
    name: gate
    needs: [check-trailer, docs-only, full-gate-build, ai-attribution]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate gate result
        env:
          TRAILER_FOUND: ${{ needs.check-trailer.outputs.found }}
          DOCS_ONLY: ${{ needs.docs-only.outputs.docs_only }}
          BUILD_RESULT: ${{ needs.full-gate-build.result }}
          ATTRIBUTION_RESULT: ${{ needs.ai-attribution.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # WHY there is no automation-author waiver here: bot PRs
          # (dependabot, release-please) pass the same ladder as everyone —
          # no trailer means BUILD_RESULT must be success. An author-keyed
          # early exit here once passed the gate before reading the build
          # result, merging red dependabot majors.

          # WHY checked first, unconditionally: an attribution violation must
          # block the gate even on a trailer-stamped or docs-only PR — neither
          # of the exemptions below are about attribution, only about whether
          # a full rebuild is necessary.
          if [ "$ATTRIBUTION_RESULT" = "failure" ] || [ "$ATTRIBUTION_RESULT" = "cancelled" ]; then
            echo "ERROR: ai-attribution check did not pass (result: ${ATTRIBUTION_RESULT})." >&2
            exit 1
          fi

          # WHY the event guard: this arm exits before BUILD_RESULT is read, so
          # without it a push whose tip happened to carry a trailer would pass
          # the gate green while full-gate-build was skipped — or, once the job
          # is forced to run on a push, while it was failing. The trailer
          # attests a pre-merge tree; on the default branch only the build
          # speaks for what is actually there. Mirrors the full-gate-build
          # routing condition, which must stay in step with this one.
          if [ "$TRAILER_FOUND" = "true" ] && [ "$EVENT_NAME" != "push" ]; then
            echo "Gate-Passed trailer verified."
            exit 0
          fi

          if [ "$DOCS_ONLY" = "true" ]; then
            echo "Docs-only changeset: full-gate-build exempt."
            exit 0
          fi

          if [ "$BUILD_RESULT" = "success" ]; then
            echo "full-gate-build passed."
            exit 0
          fi

          echo "ERROR: no Gate-Passed trailer, not a docs-only changeset, and full-gate-build did not succeed (result: ${BUILD_RESULT})." >&2
          exit 1
