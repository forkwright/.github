# WHY: Validate reusable workflow YAML before it merges to main, catching errors
# that would silently break all 11 fleet repos simultaneously.
name: actionlint

on:
  # WHY no `paths:` filter: both jobs below are REQUIRED status checks on main.
  # A required check that never runs blocks its PR permanently -- nothing fails,
  # nothing is pending, and there is nothing to point at. A filter here would
  # strand every PR touching only docs or a script outside `scripts/`.
  #
  # The cost is that a docs-only PR re-lints unchanged workflows. That is seconds,
  # and it is the correct trade for the repository whose entire content is the CI
  # eleven other repos inherit.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download actionlint
        run: |
          ACTIONLINT_VERSION=1.7.7
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          chmod +x actionlint
      - name: Run actionlint
        run: ./actionlint -color .github/workflows/*.yml

      # WHY here rather than in a job of its own: actionlint answers "is this
      # workflow well-formed before 11 repos inherit it", and so does this —
      # same question, same trigger, no second checkout. actionlint type-checks
      # the expressions but never evaluates them, so the gate's verdict ladder
      # is outside what it can see.
      #
      # NOTE: this job is a required status check on main, which is why the
      # `paths:` filter was removed from the trigger above. Do not reintroduce
      # one: a required check that cannot run on some PRs blocks those PRs
      # forever, with nothing failing and nothing pending to point at.
      - name: Check the gate verdict against the event matrix
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 scripts/check_gate_evaluation.py \
            .github/workflows/hybrid-gate.yml

  event-shape-guards:
    name: event-shape-guards
    # WHY: actionlint type-checks expressions but cannot see that a
    # pull_request-only context is empty on a push, which is the one class of
    # defect that has shipped from this repo twice (#25 and the check-trailer
    # step it missed). Runs beside actionlint because both answer "is this
    # workflow correct before 11 repos inherit it".
    #
    # NOTE: this job is a required status check on main, which is why the
    # `paths:` filter was removed from the trigger above. Do not reintroduce
    # one: a required check that cannot run on some PRs blocks those PRs
    # forever, with nothing failing and nothing pending to point at.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check pull_request-only values reaching git
        run: python3 scripts/check_event_shape_guards.py .github/workflows
