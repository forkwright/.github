# WHY: Every non-automation PR must carry a Gate-Passed trailer proving the local
# gate ran. Trusted bots are waived. Reusable; pure trailer verification, fully invariant.
name: Gate Attestation (reusable)

on:
  workflow_call: {}

permissions:
  contents: read


jobs:
  gate-attestation:
    name: gate-attestation
    runs-on: ubuntu-latest
    steps:
      # WHY: waiver keys off the PR author login, not github.actor — actor flips
      # to a maintainer login on "Re-run failed jobs", re-arming the check on bot PRs.
      # Release-please is ALSO waived branch-shaped: under GITHUB_TOKEN its PRs
      # are authored as github-actions[bot] (and as the PAT owner once a PAT is
      # wired) — the author varies, the branch pattern does not. Release-PR
      # content is generated version bumps; its verification is the live
      # deny/audit/osv checks.
      - name: Pass trusted automation PRs
        if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'release-please[bot]' || startsWith(github.head_ref, 'release-please--branches--') }}
        env:
          # WHY: head_ref is attacker-controlled text — env-var indirection keeps
          # it out of shell interpolation (actionlint expression rule).
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: echo "Gate attestation waived for trusted automation PR (author ${PR_AUTHOR}, branch ${PR_HEAD_REF})."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.user.login != 'release-please[bot]' && !startsWith(github.head_ref, 'release-please--branches--') }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Gate-Passed trailer
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.user.login != 'release-please[bot]' && !startsWith(github.head_ref, 'release-please--branches--') }}
        # WHY (#2399): bind to the PR TIP, not "any PR commit". The old loop
        # passed if any ancestor carried a Gate-Passed trailer, so an un-stamped
        # tip could ride an earlier commit's attestation — a false green on the
        # actually-merged tree.
        env:
          # WHY: head.sha reaches the script via env, not shell interpolation
          # (expression-injection rule). It is server-populated + content-addressed.
          # WHY the fallback: the context is populated on pull_request events
          # only, and `git log -1 --format="%b" ""` exits 128 with
          # `fatal: ambiguous argument ''`, so a caller triggering this reusable
          # on a push got an unreadable git crash instead of a verdict.
          # WARNING: the fallback makes a push-triggered run legible, not green.
          # This reusable has no full-gate-build fallback, so it fails whenever
          # the pushed commit carries no trailer — and squash-merged commits
          # usually do not: measured across the six hybrid callers, 0 of the last
          # 20 commits on main carry one in five of them (4 of 20 in zetesis).
          # Callers wanting default-branch coverage call hybrid-gate.yml, which
          # routes an untrailered tip to a real build instead.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          body=$(git log -1 --format="%b" "$PR_HEAD_SHA")
          if echo "$body" | grep -q "^Gate-Passed:"; then
            echo "Found gate attestation on PR tip: $(echo "$body" | grep '^Gate-Passed:' | head -1)"
          else
            echo "ERROR: PR tip carries no Gate-Passed trailer (ancestors' trailers do not count — #2399)."
            exit 1
          fi
